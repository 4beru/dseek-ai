# yaml-language-server: $schema=https://devenv.sh/devenv.schema.json
inputs:
  android-nixpkgs:
    url: github:tadfisher/android-nixpkgs
    inputs:
      nixpkgs:
        follows: nixpkgs
  nixpkgs:
    url: github:cachix/devenv-nixpkgs/rolling

# Android SDK components require Google's SDK license and allow_unfree.
# They are local development tools, not a paid API or hosted service.
allow_unfree: true
